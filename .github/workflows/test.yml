name: Tests

# The calibration tests are the product's central claims — that peeking is safe,
# that real effects are still found, that forecast ranges cover what they say.
# Running them on every push is what stops the README quietly becoming untrue.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # ubuntu-latest is now Ubuntu 26.04, for which setup-python has no 3.9 build.
          # pyproject still declares requires-python >= 3.9, so 3.9 keeps a leg on 24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
