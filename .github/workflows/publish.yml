name: Publish to PyPI

# Trusted Publishing: PyPI verifies this workflow's identity through GitHub's
# OIDC token, so no API token is ever created, stored or pasted anywhere. That
# removes the whole class of accident where a key ends up in a chat log, a shell
# history or a repo secret that nobody remembers rotating.
#
# One-time setup on PyPI (no secret to copy):
#   https://pypi.org/manage/account/publishing/
#   PyPI Project Name : noisefloor
#   Owner             : beepboop2025
#   Repository name   : noisefloor
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Then publishing a release is: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token that stands in for an API key
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4

  mcp-registry:
    # The official MCP Registry also authenticates by GitHub OIDC, so this needs
    # no secret either. PulseMCP re-ingests the official registry weekly, so
    # landing here picks that listing up for free.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # never let a registry hiccup fail a release that already shipped to PyPI
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Keep server.json version in step with the tag
        # The tag reaches Python through the environment and is only ever handled
        # as a string, so it is never interpolated into a shell command.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          version = os.environ["TAG_NAME"].lstrip("v")
          path = pathlib.Path("server.json")
          data = json.loads(path.read_text())
          data["version"] = version
          for package in data.get("packages", []):
              package["version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("server.json version ->", version)
          PY

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate by OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
