name: Publish to PyPI

# Trusted Publishing: PyPI verifies this workflow's identity through GitHub's
# OIDC token, so no API token is ever created, stored or pasted anywhere. That
# removes the whole class of accident where a key ends up in a chat log, a shell
# history or a repo secret that nobody remembers rotating.
#
# One-time setup on PyPI (no secret to copy):
#   https://pypi.org/manage/account/publishing/
#   PyPI Project Name : noisefloor
#   Owner             : beepboop2025
#   Repository name   : noisefloor
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Then publishing a release is: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify exact release version
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          from noisefloor import __version__
          package = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          registry = json.loads(pathlib.Path('server.json').read_text())
          assert os.environ['GITHUB_REF_TYPE'] == 'tag'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + package
          assert __version__ == package == registry['version']
          assert all(p['version'] == package for p in registry['packages'])
          PY
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Record release identity and checksums
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          from noisefloor import __version__
          from noisefloor.identity import implementation_sha256
          target = pathlib.Path('release-proof'); target.mkdir()
          artifacts = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path('dist').iterdir())}
          record = {'schema': 'noisefloor.release.v1', 'version': __version__,
                    'source_commit': os.environ['GITHUB_SHA'], 'tag': os.environ['GITHUB_REF_NAME'],
                    'implementation_sha256': implementation_sha256(), 'artifacts': artifacts,
                    'runtime_dependencies': [], 'market_performance_validated': False}
          (target/'source.json').write_text(json.dumps(record, indent=2) + '\n')
          (target/'SHA256SUMS').write_text(''.join(f'{sha}  {name}\n' for name, sha in artifacts.items()))
          PY
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-proof
          path: release-proof/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token that stands in for an API key
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4

  mcp-registry:
    # The official MCP Registry also authenticates by GitHub OIDC, so this needs
    # no secret either. PulseMCP re-ingests the official registry weekly, so
    # landing here picks that listing up for free.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # never let a registry hiccup fail a release that already shipped to PyPI
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify Registry version matches the tag
        # The tag reaches Python through the environment and is only ever handled
        # as a string, so it is never interpolated into a shell command.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          version = os.environ["TAG_NAME"].lstrip("v")
          path = pathlib.Path("server.json")
          data = json.loads(path.read_text())
          assert data["version"] == version
          assert all(package["version"] == version for package in data.get("packages", []))
          print("server.json verified:", version)
          PY

      - name: Install mcp-publisher
        run: |
          curl -sSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate by OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-proof
          path: release-proof/
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "NoiseFloor $GITHUB_REF_NAME" --notes-file CHANGELOG.md dist/* release-proof/*
