[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noisefloor"
version = "0.2.0"
description = "Is this number real, or is it noise? Peek-safe A/B tests, change detection and honest forecasts. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "beepboop2025" }]
keywords = [
    "ab-testing", "sequential-testing", "anytime-valid", "confidence-sequence",
    "change-detection", "anomaly-detection", "statistics", "experimentation",
    "conformal-prediction", "mcp", "monitoring", "calibration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# No dependencies. That is the point: it installs anywhere Python does.
dependencies = []

[project.urls]
Homepage = "https://github.com/beepboop2025/noisefloor"
Issues = "https://github.com/beepboop2025/noisefloor/issues"

[project.scripts]
noisefloor-mcp = "noisefloor.mcp_server:main"
noisefloor-mcp-http = "noisefloor.http_server:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["noisefloor"]
