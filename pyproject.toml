[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noisefloor"
version = "0.4.3"
description = "Offline market and headline diagnostics for Python and AI agents: source-aware research with zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "beepboop2025" }]
keywords = [
    "ab-testing", "sequential-testing", "anytime-valid", "confidence-sequence",
    "change-detection", "anomaly-detection", "statistics", "experimentation",
    "conformal-prediction", "mcp", "monitoring", "calibration",
    "market-data", "data-quality", "news-deduplication", "agents",
    "financial-research", "liquilens", "seiche", "undertow", "palimpsest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# No dependencies. That is the point: it installs anywhere Python does.
dependencies = []

[project.urls]
Homepage = "https://github.com/beepboop2025/noisefloor"
Documentation = "https://beepboop2025.github.io/financial-evidence-skills/api/noisefloor/"
Source = "https://github.com/beepboop2025/noisefloor"
Issues = "https://github.com/beepboop2025/noisefloor/issues"
Changelog = "https://github.com/beepboop2025/noisefloor/blob/main/CHANGELOG.md"
"Product connections" = "https://beepboop2025.github.io/financial-evidence-skills/connect/"
"Correlation workbench" = "https://liquilens.in/agents/correlation/"

[project.scripts]
noisefloor = "noisefloor.cli:main"
noisefloor-mcp = "noisefloor.mcp_server:main"
noisefloor-mcp-http = "noisefloor.http_server:main"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.18,<5"]

[tool.hatch.build.targets.wheel]
packages = ["noisefloor"]
